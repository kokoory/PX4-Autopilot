module_name: mc_nn_control
parameters:
- group: Neural Control
  definitions:
    MC_NN_EN:
      description:
        short: If true the neural network control is automatically started on boot
      type: boolean
      default: 1
    MC_NN_MAX_RPM:
      description:
        short: Max motor RPM for neural network normalization
        long: The maximum RPM of the motors. Used to normalize the output of the neural
          network
      type: int32
      default: 22000
      min: 0
      max: 80000
    MC_NN_MIN_RPM:
      description:
        short: Min motor RPM for neural network normalization
        long: The minimum RPM of the motors. Used to normalize the output of the neural
          network
      type: int32
      default: 1000
      min: 0
      max: 80000
    MC_NN_THRST_COEF:
      description:
        short: Motor thrust coefficient for NN normalization
        long: Thrust coefficient of the motors. Used to normalize the output of the
          neural network. Divided by 100 000
      type: float
      default: 1.2
      min: 0.0
      max: 5.0
    MC_NN_MANL_CTRL:
      description:
        short: Enable or disable setting the trajectory setpoint with manual control
      type: boolean
      default: 1
      reboot_required: true
    MC_NN_FALLBACK:
      description:
        short: Enable automatic PID fallback on NN inference failure
        long: When enabled, the controller automatically falls back to traditional
          PID control if the neural network produces invalid outputs (NaN, out of
          range) or exceeds the inference time budget for consecutive cycles.
      type: boolean
      default: 1
    MC_NN_MAX_INF_T:
      description:
        short: Maximum allowed inference time in microseconds
        long: If a single NN inference takes longer than this value, it is counted
          as a failure. Used together with MC_NN_ERR_LIM to trigger PID fallback.
      type: int32
      default: 2500
      min: 500
      max: 10000
      unit: us
    MC_NN_MODEL_ID:
      description:
        short: Active distilled model identifier
        long: Identifier for the currently deployed distilled model. Used for
          telemetry and ground station display. Set by the distillation pipeline.
      type: int32
      default: 0
      min: 0
      max: 255
    MC_NN_ERR_LIM:
      description:
        short: Consecutive inference error limit before PID fallback
        long: Number of consecutive failed inferences (NaN, out of range, or
          timeout) before the controller automatically switches to PID fallback.
          Only effective when MC_NN_FALLBACK is enabled.
      type: int32
      default: 5
      min: 1
      max: 100
    MC_NN_NUM_MOT:
      description:
        short: Number of motor outputs from the neural network
        long: Number of motors controlled by the NN. For a quadrotor this is 4,
          for a singlecopter this is 1. The first MC_NN_NUM_MOT outputs of the NN
          are published as actuator_motors.
      type: int32
      default: 1
      min: 1
      max: 12
      reboot_required: true
    MC_NN_NUM_SRV:
      description:
        short: Number of servo outputs from the neural network
        long: Number of servos controlled by the NN. For a quadrotor this is 0,
          for a singlecopter with 4 vanes this is 4. The NN outputs after the
          motor outputs are published as actuator_servos.
      type: int32
      default: 4
      min: 0
      max: 8
      reboot_required: true
